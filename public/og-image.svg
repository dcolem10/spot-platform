<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0c0c14"/>
      <stop offset="50%" stop-color="#111119"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <radialGradient id="glow-orange" cx="0.25" cy="0.35" r="0.45">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="0.75" cy="0.65" r="0.4">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink" cx="0.5" cy="0.9" r="0.35">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent-warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="bar-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="logo-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f97316" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Deep dark background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient gradient orbs -->
  <rect width="1200" height="630" fill="url(#glow-orange)"/>
  <rect width="1200" height="630" fill="url(#glow-purple)"/>
  <rect width="1200" height="630" fill="url(#glow-pink)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.04">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#fff"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- ─── LEFT SIDE: Branding ─── -->

  <!-- Logo with glow -->
  <g filter="url(#logo-glow)">
    <rect x="80" y="195" width="64" height="64" rx="16" fill="url(#accent-warm)"/>
    <text x="112" y="240" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34">S</text>
  </g>

  <!-- Brand name -->
  <text x="160" y="240" fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">Spot</text>

  <!-- Tagline with gradient effect (simulated) -->
  <text x="80" y="310" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="26">Turn restaurant content</text>
  <text x="80" y="346" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="26">into creator revenue.</text>

  <!-- Subtitle -->
  <text x="80" y="400" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="17">Campaigns, analytics, deals, and AI insights —</text>
  <text x="80" y="424" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="17">the operating system for food creators.</text>

  <!-- Feature pills -->
  <rect x="80" y="464" width="112" height="34" rx="17" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.25)" stroke-width="1"/>
  <text x="136" y="486" text-anchor="middle" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">Campaigns</text>

  <rect x="204" y="464" width="76" height="34" rx="17" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="242" y="486" text-anchor="middle" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">ROI</text>

  <rect x="292" y="464" width="80" height="34" rx="17" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
  <text x="332" y="486" text-anchor="middle" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">Deals</text>

  <rect x="384" y="464" width="108" height="34" rx="17" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <text x="438" y="486" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">AI Insights</text>

  <!-- ─── RIGHT SIDE: Dashboard Card ─── -->
  <g filter="url(#card-shadow)">
    <rect x="620" y="80" width="500" height="470" rx="20" fill="url(#card-bg)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- Top accent border on card -->
  <rect x="640" y="80" width="460" height="3" rx="1.5" fill="url(#accent-grad)" opacity="0.5"/>

  <!-- Dashboard header -->
  <text x="652" y="128" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" letter-spacing="0.5">CREATOR DASHBOARD</text>

  <!-- Metric cards row -->
  <rect x="652" y="150" width="146" height="80" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="672" y="177" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11">PARTNERSHIPS</text>
  <text x="672" y="212" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">10</text>

  <rect x="810" y="150" width="146" height="80" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="830" y="177" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11">REVENUE</text>
  <text x="830" y="212" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">$31K</text>

  <rect x="968" y="150" width="130" height="80" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="988" y="177" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11">AUDIENCE</text>
  <text x="988" y="212" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">934K</text>

  <!-- Pipeline section -->
  <text x="652" y="268" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="0.5">PIPELINE</text>

  <!-- Pipeline bar -->
  <rect x="652" y="282" width="446" height="14" rx="7" fill="rgba(255,255,255,0.04)"/>
  <rect x="652" y="282" width="120" height="14" rx="7" fill="url(#bar-blue)"/>
  <rect x="772" y="282" width="90" height="14" fill="#eab308"/>
  <rect x="862" y="282" width="150" height="14" fill="url(#bar-green)"/>
  <rect x="1012" y="282" width="86" height="14" rx="7" fill="url(#accent-warm)"/>

  <!-- Pipeline labels -->
  <text x="712" y="314" text-anchor="middle" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10">Inquiry</text>
  <text x="817" y="314" text-anchor="middle" fill="#eab308" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10">Negotiation</text>
  <text x="937" y="314" text-anchor="middle" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10">Active</text>
  <text x="1055" y="314" text-anchor="middle" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10">Completed</text>

  <!-- Recent Activity section -->
  <text x="652" y="352" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="0.5">RECENT ACTIVITY</text>

  <!-- Activity items -->
  <rect x="652" y="366" width="446" height="44" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="676" cy="388" r="5" fill="#22c55e"/>
  <text x="694" y="384" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13">New deal closed — Founding Farmers</text>
  <text x="694" y="400" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="11">2 hours ago</text>

  <rect x="652" y="418" width="446" height="44" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="676" cy="440" r="5" fill="#f97316"/>
  <text x="694" y="436" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13">QR scans up 23% — Rasika promotion</text>
  <text x="694" y="452" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="11">5 hours ago</text>

  <rect x="652" y="470" width="446" height="44" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="676" cy="492" r="5" fill="#8b5cf6"/>
  <text x="694" y="488" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13">AI insight — Brunch content drives 3x saves</text>
  <text x="694" y="504" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="11">Today</text>

  <!-- Bottom gradient accent line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#accent-grad)" opacity="0.5"/>
</svg>
