<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="50%" stop-color="#141825"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.3" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.7" r="0.4">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Left side: Branding -->
  <!-- Logo icon -->
  <rect x="80" y="180" width="72" height="72" rx="18" fill="url(#accent)"/>
  <text x="116" y="232" text-anchor="middle" fill="white" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="38">S</text>

  <!-- Brand name -->
  <text x="170" y="230" fill="white" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="56">Spot</text>

  <!-- Tagline -->
  <text x="80" y="300" fill="#e2e8f0" font-family="Inter, -apple-system, sans-serif" font-weight="600" font-size="28">Turn restaurant visits into revenue.</text>

  <!-- Subtitle -->
  <text x="80" y="348" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-weight="400" font-size="20">Partnership management, ROI tracking, and audience</text>
  <text x="80" y="376" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-weight="400" font-size="20">tools built for food creators.</text>

  <!-- Feature pills -->
  <rect x="80" y="416" width="130" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="145" y="440" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="14">Campaigns</text>

  <rect x="222" y="416" width="110" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="277" y="440" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="14">Analytics</text>

  <rect x="344" y="416" width="90" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="389" y="440" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="14">Deals</text>

  <rect x="446" y="416" width="130" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="511" y="440" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="14">AI Insights</text>

  <!-- Right side: Mini dashboard mockup -->
  <!-- Dashboard card background -->
  <rect x="680" y="100" width="440" height="430" rx="16" fill="#1a1f2e" stroke="#2a3040" stroke-width="1"/>

  <!-- Dashboard header -->
  <rect x="704" y="124" width="120" height="12" rx="6" fill="#334155"/>
  <rect x="704" y="144" width="80" height="8" rx="4" fill="#1e293b"/>

  <!-- Metric cards row -->
  <rect x="704" y="172" width="96" height="64" rx="10" fill="#1e293b" stroke="#2a3040" stroke-width="1"/>
  <text x="720" y="195" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="10">Partners</text>
  <text x="720" y="222" fill="#e2e8f0" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="22">10</text>

  <rect x="810" y="172" width="96" height="64" rx="10" fill="#1e293b" stroke="#2a3040" stroke-width="1"/>
  <text x="826" y="195" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="10">Revenue</text>
  <text x="826" y="222" fill="#22c55e" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="22">$31K</text>

  <rect x="916" y="172" width="96" height="64" rx="10" fill="#1e293b" stroke="#2a3040" stroke-width="1"/>
  <text x="932" y="195" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="10">Reach</text>
  <text x="932" y="222" fill="#3b82f6" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="22">934K</text>

  <!-- Pipeline bar -->
  <rect x="704" y="260" width="100" height="8" rx="4" fill="#334155"/>
  <rect x="704" y="280" width="392" height="16" rx="8" fill="#1e293b"/>
  <rect x="704" y="280" width="100" height="16" rx="8" fill="url(#bar2)"/>
  <rect x="804" y="280" width="80" height="16" fill="#eab308"/>
  <rect x="884" y="280" width="140" height="16" fill="url(#bar1)"/>
  <rect x="1024" y="280" width="72" height="16" rx="0" fill="url(#bar3)"/>
  <!-- Round right end -->
  <rect x="1080" y="280" width="16" height="16" rx="8" fill="url(#bar3)"/>

  <!-- Activity list -->
  <rect x="704" y="316" width="80" height="8" rx="4" fill="#334155"/>

  <rect x="704" y="340" width="392" height="40" rx="8" fill="#1e293b"/>
  <circle cx="724" cy="360" r="6" fill="#22c55e"/>
  <rect x="740" y="354" width="160" height="8" rx="4" fill="#334155"/>
  <rect x="740" y="366" width="100" height="6" rx="3" fill="#1e293b"/>

  <rect x="704" y="388" width="392" height="40" rx="8" fill="#1e293b"/>
  <circle cx="724" cy="408" r="6" fill="#f97316"/>
  <rect x="740" y="402" width="140" height="8" rx="4" fill="#334155"/>
  <rect x="740" y="414" width="80" height="6" rx="3" fill="#1e293b"/>

  <rect x="704" y="436" width="392" height="40" rx="8" fill="#1e293b"/>
  <circle cx="724" cy="456" r="6" fill="#3b82f6"/>
  <rect x="740" y="450" width="180" height="8" rx="4" fill="#334155"/>
  <rect x="740" y="462" width="110" height="6" rx="3" fill="#1e293b"/>

  <rect x="704" y="484" width="392" height="40" rx="8" fill="#1e293b"/>
  <circle cx="724" cy="504" r="6" fill="#eab308"/>
  <rect x="740" y="498" width="120" height="8" rx="4" fill="#334155"/>
  <rect x="740" y="510" width="90" height="6" rx="3" fill="#1e293b"/>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)" opacity="0.6"/>
</svg>
