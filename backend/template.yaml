AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Spot Platform — Creator-powered restaurant discovery, partnerships, and audience tools

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref DataTable
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  AllowedOrigin:
    Type: String
    Default: 'http://localhost:5173'
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for API authorization
  AnthropicApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: >-
      Anthropic API key for AI features.
      NOTE: For production, migrate to AWS Secrets Manager and retrieve at runtime.
  GooglePlacesApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: >-
      Google Places API key for restaurant data sync.
      NOTE: For production, migrate to AWS Secrets Manager and retrieve at runtime.
  StripeSecretKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Stripe secret key for payment processing
  StripeWebhookSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Stripe webhook signing secret
  FromEmail:
    Type: String
    Default: 'networth589@gmail.com'
    Description: Verified SES sender email address

Resources:
  # ─── DynamoDB ─────────────────────────────────────────────────────────────
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub spot-data-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ─── API Gateway ──────────────────────────────────────────────────────────
  SpotApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub spot-api-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      # H4: API Gateway throttling to protect AI endpoints and control costs.
      # Stage-level default throttle applies to all methods including /api/ai/*.
      # For more granular per-path throttling, use a Usage Plan resource.
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # ─── Main API Lambda ─────────────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-api-${Environment}
      CodeUri: lambda-api/
      Handler: index.handler
      Timeout: 15
      Environment:
        Variables:
          GOOGLE_PLACES_API_KEY: !Ref GooglePlacesApiKey
          EMAIL_FUNCTION_NAME: !Ref EmailFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt EmailFunction.Arn
      Events:
        # Authenticated endpoints (default Cognito authorizer applies)
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/{proxy+}
            Method: ANY
        # Public endpoints — no auth required
        OfferScan:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/offers/{offerId}/scan
            Method: GET
            Auth:
              Authorizer: NONE
        OfferRedeem:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/offers/{offerId}/redeem
            Method: POST
            Auth:
              Authorizer: NONE
        Subscribe:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/subscribe
            Method: POST
            Auth:
              Authorizer: NONE
        InsiderDeals:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/insider/deals
            Method: GET
            Auth:
              Authorizer: NONE
        RestaurantsList:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/restaurants
            Method: GET
            Auth:
              Authorizer: NONE
        RestaurantDetail:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/restaurants/{restaurantId}
            Method: GET
            Auth:
              Authorizer: NONE
        GoogleDetails:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/restaurants/{restaurantId}/google-details
            Method: GET
            Auth:
              Authorizer: NONE
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE

  # ─── AI Lambda ────────────────────────────────────────────────────────────
  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-ai-${Environment}
      CodeUri: lambda-ai/
      Handler: index.handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        AiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/ai/{proxy+}
            Method: ANY

  # ─── Background Sync Lambda ──────────────────────────────────────────────
  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-sync-${Environment}
      CodeUri: lambda-sync/
      Handler: index.handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          GOOGLE_PLACES_API_KEY: !Ref GooglePlacesApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        DailySync:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Description: Daily restaurant data refresh
            Enabled: false

  # ─── Stripe Subscription Lambda ───────────────────────────────────────────
  StripeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-stripe-${Environment}
      CodeUri: lambda-stripe/
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        StripeProxy:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/stripe/{proxy+}
            Method: ANY
        StripeWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/stripe/webhook
            Method: POST
            Auth:
              Authorizer: NONE

  # ─── Email Lambda ─────────────────────────────────────────────────────────
  EmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-email-${Environment}
      CodeUri: lambda-email/
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          FROM_EMAIL: !Ref FromEmail
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  # ─── CloudWatch Alarms ───────────────────────────────────────────────────
  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-api-errors-${Environment}
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction

  AiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-ai-errors-${Environment}
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AiFunction

  # ─── Budget Alert ────────────────────────────────────────────────────────
  BudgetAlert:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub spot-monthly-${Environment}
        BudgetLimit:
          Amount: 50
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${SpotApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  TableName:
    Description: DynamoDB table name
    Value: !Ref DataTable
