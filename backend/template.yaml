AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Spot Platform — Creator-powered restaurant discovery, partnerships, and audience tools

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref DataTable
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        LOG_LEVEL: info

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  AllowedOrigin:
    Type: String
    Default: 'http://localhost:5173'
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for API authorization
  SecretsArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing API keys (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, ANTHROPIC_API_KEY, GOOGLE_PLACES_API_KEY)
  FromEmail:
    Type: String
    Default: 'networth589@gmail.com'
    Description: Verified SES sender email address

Resources:
  # ─── DynamoDB ─────────────────────────────────────────────────────────────
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub spot-data-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ─── S3 — Restaurant Photos ──────────────────────────────────────────────
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub spot-photos-${Environment}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigin, 'https://spot-platform.com']
            AllowedMethods: [GET]
            AllowedHeaders: ['Content-Type', 'Authorization', 'Cache-Control']
            MaxAge: 86400
      LifecycleConfiguration:
        Rules:
          - Id: CleanupIncomplete
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadPhotos
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${PhotosBucket.Arn}/restaurants/*'

  # ─── API Gateway ──────────────────────────────────────────────────────────
  SpotApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub spot-api-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.resourcePath","status":"$context.status","latency":"$context.responseLatency","error":"$context.error.message"}'
      # H4: API Gateway throttling to protect AI endpoints and control costs.
      # Stage-level default throttle applies to all methods including /api/ai/*.
      # For more granular per-path throttling, use a Usage Plan resource.
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # ─── Main API Lambda ─────────────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-api-${Environment}
      CodeUri: lambda-api/
      Handler: index.handler
      Timeout: 15
      # ReservedConcurrentExecutions: 50  # Enable after requesting quota increase (default account limit is 10)
      Environment:
        Variables:
          SECRETS_ARN: !Ref SecretsArn
          EMAIL_FUNCTION_NAME: !Ref EmailFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt EmailFunction.Arn
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SecretsArn
      Events:
        # Authenticated endpoints (default Cognito authorizer applies)
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/{proxy+}
            Method: ANY
        # CORS preflight — must bypass Cognito authorizer
        ProxyOptions:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        # Public endpoints — no auth required
        OfferScan:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/offers/{offerId}/scan
            Method: GET
            Auth:
              Authorizer: NONE
        OfferRedeem:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/offers/{offerId}/redeem
            Method: POST
            Auth:
              Authorizer: NONE
        Subscribe:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/subscribe
            Method: POST
            Auth:
              Authorizer: NONE
        Unsubscribe:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/unsubscribe
            Method: POST
            Auth:
              Authorizer: NONE
        InsiderDeals:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/insider/deals
            Method: GET
            Auth:
              Authorizer: NONE
        RestaurantsList:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/restaurants
            Method: GET
            Auth:
              Authorizer: NONE
        RestaurantDetail:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/restaurants/{restaurantId}
            Method: GET
            Auth:
              Authorizer: NONE
        RestaurantOffers:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/restaurants/{restaurantId}/offers
            Method: GET
            Auth:
              Authorizer: NONE
        GoogleDetails:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/restaurants/{restaurantId}/google-details
            Method: GET
            Auth:
              Authorizer: NONE
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE

  # ─── AI Lambda ────────────────────────────────────────────────────────────
  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-ai-${Environment}
      CodeUri: lambda-ai/
      Handler: index.handler
      Timeout: 60
      MemorySize: 512
      # ReservedConcurrentExecutions: 10  # Enable after requesting quota increase
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          SECRETS_ARN: !Ref SecretsArn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SecretsArn
      Events:
        AiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/ai/{proxy+}
            Method: ANY
        AiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/ai/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  # ─── Background Sync Lambda ──────────────────────────────────────────────
  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-sync-${Environment}
      CodeUri: lambda-sync/
      Handler: index.handler
      Timeout: 300
      MemorySize: 1024
      # ReservedConcurrentExecutions: 5  # Enable after requesting quota increase
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          SECRETS_ARN: !Ref SecretsArn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SecretsArn
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt SyncDLQ.Arn
      Events:
        DailySync:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Description: Daily restaurant data refresh
            Enabled: true

  # ─── Stripe Subscription Lambda ───────────────────────────────────────────
  StripeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-stripe-${Environment}
      CodeUri: lambda-stripe/
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      # ReservedConcurrentExecutions: 10  # Enable after requesting quota increase
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          SECRETS_ARN: !Ref SecretsArn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SecretsArn
      Events:
        StripeProxy:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/stripe/{proxy+}
            Method: ANY
        StripeOptions:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/stripe/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        StripeWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref SpotApi
            Path: /api/stripe/webhook
            Method: POST
            Auth:
              Authorizer: NONE

  # ─── Lifecycle Email Scheduler ─────────────────────────────────────────────
  LifecycleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-lifecycle-${Environment}
      CodeUri: lambda-lifecycle/
      Handler: index.handler
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          EMAIL_FUNCTION_NAME: !Ref EmailFunction
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt EmailFunction.Arn
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt LifecycleDLQ.Arn
      Events:
        DailyLifecycle:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Description: Daily lifecycle email check (day 1, 14, 28)
            Enabled: true

  # ─── Email Lambda ─────────────────────────────────────────────────────────
  EmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-email-${Environment}
      CodeUri: lambda-email/
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          FROM_EMAIL: !Ref FromEmail
          SES_CONFIG_SET: !Ref SESConfigurationSet
          TABLE_NAME: !Ref DataTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${FromEmail}'
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${SESConfigurationSet}'
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt DataTable.Arn
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt EmailDLQ.Arn

  # ─── SES Bounce/Complaint Handler Lambda ──────────────────────────────────
  SESHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spot-ses-handler-${Environment}
      CodeUri: lambda-ses-handler/
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt DataTable.Arn
      Events:
        BounceTopic:
          Type: SNS
          Properties:
            Topic: !Ref SESBounceTopic
        ComplaintTopic:
          Type: SNS
          Properties:
            Topic: !Ref SESComplaintTopic

  # ─── CloudWatch Log Groups ────────────────────────────────────────────────
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spot-api-${Environment}'
      RetentionInDays: 30

  AiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spot-ai-${Environment}'
      RetentionInDays: 30

  SyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spot-sync-${Environment}'
      RetentionInDays: 30

  StripeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spot-stripe-${Environment}'
      RetentionInDays: 30

  LifecycleLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spot-lifecycle-${Environment}'
      RetentionInDays: 30

  EmailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spot-email-${Environment}'
      RetentionInDays: 30

  SESHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/spot-ses-handler-${Environment}'
      RetentionInDays: 30

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/spot-api-${Environment}'
      RetentionInDays: 30

  # ─── CloudWatch Alarms ───────────────────────────────────────────────────
  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-api-errors-${Environment}
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction

  AiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-ai-errors-${Environment}
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AiFunction

  # ─── Budget Alert ────────────────────────────────────────────────────────
  BudgetAlert:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub spot-monthly-${Environment}
        BudgetLimit:
          Amount: 50
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST

  # ─── Additional CloudWatch Alarms ─────────────────────────────────────────
  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-api-latency-avg-${Environment}
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      TreatMissingData: notBreaching

  DynamoDBThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-dynamodb-throttle-${Environment}
      MetricName: ThrottledRequests
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref DataTable
      TreatMissingData: notBreaching

  AiCostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-ai-invocations-daily-${Environment}
      MetricName: Invocations
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AiFunction
      TreatMissingData: notBreaching

  # ─── Lambda Error Alarms (Stripe, Email, Lifecycle, Sync) ───────────────
  StripeErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-stripe-errors-${Environment}
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeFunction
      TreatMissingData: notBreaching

  EmailErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-email-errors-${Environment}
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref EmailFunction
      TreatMissingData: notBreaching

  LifecycleErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-lifecycle-errors-${Environment}
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref LifecycleFunction
      TreatMissingData: notBreaching

  SyncErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-sync-errors-${Environment}
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref SyncFunction
      TreatMissingData: notBreaching

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-api-gateway-5xx-${Environment}
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Sub spot-api-${Environment}
      TreatMissingData: notBreaching

  # ─── Dead Letter Queues ─────────────────────────────────────────────────
  LifecycleDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub spot-lifecycle-dlq-${Environment}
      MessageRetentionPeriod: 1209600

  EmailDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub spot-email-dlq-${Environment}
      MessageRetentionPeriod: 1209600

  SyncDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub spot-sync-dlq-${Environment}
      MessageRetentionPeriod: 1209600

  # ─── DLQ Wiring (EventInvokeConfig) ─────────────────────────────────────
  LifecycleEventInvoke:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref LifecycleFunction
      Qualifier: $LATEST
      MaximumEventAgeInSeconds: 3600
      MaximumRetryAttempts: 2
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt LifecycleDLQ.Arn

  EmailEventInvoke:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref EmailFunction
      Qualifier: $LATEST
      MaximumEventAgeInSeconds: 300
      MaximumRetryAttempts: 1
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt EmailDLQ.Arn

  SyncEventInvoke:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref SyncFunction
      Qualifier: $LATEST
      MaximumEventAgeInSeconds: 7200
      MaximumRetryAttempts: 0
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt SyncDLQ.Arn

  # ─── DLQ Alarms ─────────────────────────────────────────────────────────
  LifecycleDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-lifecycle-dlq-${Environment}
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt LifecycleDLQ.QueueName
      TreatMissingData: notBreaching

  EmailDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-email-dlq-${Environment}
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EmailDLQ.QueueName
      TreatMissingData: notBreaching

  SyncDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub spot-sync-dlq-${Environment}
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SyncDLQ.QueueName
      TreatMissingData: notBreaching

  # ─── SES Bounce/Complaint Infrastructure ─────────────────────────────────
  SESConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub spot-ses-config-${Environment}

  SESBounceTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub spot-ses-bounces-${Environment}

  SESComplaintTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub spot-ses-complaints-${Environment}

  SESBounceEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SESConfigurationSet
      EventDestination:
        Name: BounceNotification
        Enabled: true
        MatchingEventTypes:
          - bounce
        SnsDestination:
          TopicARN: !Ref SESBounceTopic

  SESComplaintEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SESConfigurationSet
      EventDestination:
        Name: ComplaintNotification
        Enabled: true
        MatchingEventTypes:
          - complaint
        SnsDestination:
          TopicARN: !Ref SESComplaintTopic

  # ─── CloudWatch Dashboard ────────────────────────────────────────────────
  SpotDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub spot-platform-${Environment}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}" ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}" ],
                  [ "AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}" ]
                ],
                "stat": "Sum",
                "period": 300,
                "region": "${AWS::Region}",
                "title": "API Lambda Metrics"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${AiFunction}" ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${AiFunction}" ],
                  [ "AWS/Lambda", "Duration", "FunctionName", "${AiFunction}" ]
                ],
                "stat": "Sum",
                "period": 300,
                "region": "${AWS::Region}",
                "title": "AI Lambda Metrics"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${DataTable}" ],
                  [ "AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${DataTable}" ]
                ],
                "stat": "Sum",
                "period": 300,
                "region": "${AWS::Region}",
                "title": "DynamoDB Capacity"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ApiGateway", "4XXError", "ApiName", "spot-api-${Environment}" ],
                  [ "AWS/ApiGateway", "5XXError", "ApiName", "spot-api-${Environment}" ]
                ],
                "stat": "Sum",
                "period": 300,
                "region": "${AWS::Region}",
                "title": "API Gateway Errors"
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${SpotApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  TableName:
    Description: DynamoDB table name
    Value: !Ref DataTable
  PhotosBucketName:
    Description: S3 bucket for restaurant photos
    Value: !Ref PhotosBucket
  PhotosBucketUrl:
    Description: Public URL prefix for restaurant photos
    Value: !Sub https://${PhotosBucket}.s3.amazonaws.com
